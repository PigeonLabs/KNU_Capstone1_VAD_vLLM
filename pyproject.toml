[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipad-vad-pipeline"
version = "0.1.0"
description = "Normal-only object-centric industrial video anomaly detection experiments"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pillow", "scikit-learn", "matplotlib", "torch", "torchvision", "transformers>=4.51,<5", "opencv-python-headless"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
